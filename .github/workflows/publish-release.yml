name: Publish release

# Manually publish an existing *draft* release created by build-armbian.yml.
# The build workflow intentionally keeps draft: true, so publishing is a
# separate, explicit decision. All guards live in
# .github/scripts/publish-release.sh (shared with the scheduled build run) and
# nothing is published when a check fails.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to publish (e.g. ci-20261114-002309-UTC)"
        required: true
        type: string
      prerelease:
        description: "Mark the published release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Publish draft release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: bash .github/scripts/publish-release.sh
