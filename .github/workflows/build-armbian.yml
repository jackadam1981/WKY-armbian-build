name: Build Armbian for WS-1608

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      board:
        description: '板型名称 - 选择要编译的目标板型'
        required: false
        type: choice
        default: 'onecloud'
        options:
          - onecloud
      branch:
        description: 'ARMBIAN 分支 - current: 稳定分支(推荐) | edge: 开发分支(最新功能)'
        required: false
        type: choice
        default: 'current'
        options:
          - current
          - edge
      release:
        description: '基础发行版 - bullseye: Debian 11(稳定) | bookworm: Debian 12 | jammy: Ubuntu 22.04 LTS'
        required: false
        type: choice
        default: 'bookworm'
        options:
          - bullseye
          - bookworm
          - jammy

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 增加到 4 小时，ARMBIAN 编译通常需要 2-4 小时
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: apt-${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            build-essential \
            libssl-dev \
            python3 \
            python3-pip \
            device-tree-compiler \
            u-boot-tools \
            binfmt-support \
            qemu-user-static \
            debootstrap \
            btrfs-progs \
            dosfstools \
            bc \
            bison \
            flex \
            libncurses5-dev \
            libc6-dev-armhf-cross \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Configure build parameters
        id: config
        run: |
          BOARD="${{ github.event.inputs.board || 'onecloud' }}"
          BRANCH="${{ github.event.inputs.branch || 'current' }}"
          RELEASE="${{ github.event.inputs.release || 'bullseye' }}"
          
          echo "board=${BOARD}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "release=${RELEASE}" >> $GITHUB_OUTPUT
          
          echo "::group::Build Configuration"
          echo "Building Armbian for WS-1608"
          echo "Board: ${BOARD}"
          echo "Branch: ${BRANCH}"
          echo "Release: ${RELEASE}"
          echo "::endgroup::"

      - name: Clone Armbian build repository
        run: |
          git clone --depth=1 https://github.com/armbian/build.git armbian-build
          cd armbian-build
          git fetch --depth=100 || true

      - name: Build Armbian image
        working-directory: armbian-build
        env:
          DEBIAN_FRONTEND: noninteractive
          BOARD: ${{ steps.config.outputs.board }}
          BRANCH: ${{ steps.config.outputs.branch }}
          RELEASE: ${{ steps.config.outputs.release }}
          BUILD_MINIMAL: "no"
          BUILD_DESKTOP: "no"
          KERNEL_CONFIGURE: "no"
          COMPRESS_OUTPUTIMAGE: "sha,img"
        run: |
          echo "::group::Build Log"
          # Provide "no" input to any interactive prompts
          yes "no" | ./compile.sh \
            BOARD=${BOARD} \
            BRANCH=${BRANCH} \
            RELEASE=${RELEASE} \
            BUILD_MINIMAL=${BUILD_MINIMAL} \
            BUILD_DESKTOP=${BUILD_DESKTOP} \
            KERNEL_CONFIGURE=${KERNEL_CONFIGURE} \
            COMPRESS_OUTPUTIMAGE=${COMPRESS_OUTPUTIMAGE} || {
              echo "::error::Build failed!"
              exit 1
            }
          echo "::endgroup::"

      - name: List output files
        working-directory: armbian-build
        if: success()
        run: |
          echo "::group::Build Output Files"
          find output/images -type f \( -name "*.img" -o -name "*.sha" -o -name "*.xz" \) 2>/dev/null | head -20 || true
          echo ""
          echo "File sizes:"
          ls -lh output/images/ 2>/dev/null | head -20 || true
          echo "::endgroup::"

      - name: Calculate build summary
        id: summary
        if: always()
        working-directory: armbian-build
        run: |
          if [ -d "output/images" ]; then
            IMG_COUNT=$(find output/images -name "*.img" -type f 2>/dev/null | wc -l)
            SHA_COUNT=$(find output/images -name "*.sha" -type f 2>/dev/null | wc -l)
            TOTAL_SIZE=$(du -sh output/images 2>/dev/null | cut -f1 || echo "0")
            echo "images=${IMG_COUNT}" >> $GITHUB_OUTPUT
            echo "checksums=${SHA_COUNT}" >> $GITHUB_OUTPUT
            echo "size=${TOTAL_SIZE}" >> $GITHUB_OUTPUT
          else
            echo "images=0" >> $GITHUB_OUTPUT
            echo "checksums=0" >> $GITHUB_OUTPUT
            echo "size=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Armbian image artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armbian-ws1608-${{ steps.config.outputs.board }}-${{ steps.config.outputs.release }}-${{ github.run_number }}
          path: |
            armbian-build/output/images/*.img
            armbian-build/output/images/*.img.sha
            armbian-build/output/images/*.xz
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0  # 镜像文件已压缩，不需要再次压缩

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            armbian-build/output/logs/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          echo "::group::Build Summary"
          echo "Board: ${{ steps.config.outputs.board }}"
          echo "Branch: ${{ steps.config.outputs.branch }}"
          echo "Release: ${{ steps.config.outputs.release }}"
          echo "Images: ${{ steps.summary.outputs.images }}"
          echo "Checksums: ${{ steps.summary.outputs.checksums }}"
          echo "Total Size: ${{ steps.summary.outputs.size }}"
          echo "Status: ${{ job.status }}"
          echo "::endgroup::"

