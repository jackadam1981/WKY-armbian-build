name: Build Armbian for WS-1608

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: hzyitc/u-boot-onecloud
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
    steps:
      - id: get
        name: Get repositories information
        run: |
          TIME="$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID} | jq -r .created_at)"
          TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"

          SCRIPT_SHA=$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF} | jq -r .sha)
          
          # Get u-boot tag - use releases/latest API endpoint
          if [ "${UBOOT_RELEASE}" = "latest" ]; then
            echo "Fetching latest release from ${UBOOT_REPO}..."
            LATEST_RESPONSE=$(curl -s https://api.github.com/repos/${UBOOT_REPO}/releases/latest)
            UBOOT_TAG=$(echo "$LATEST_RESPONSE" | jq -r .tag_name)
            
            # Check if API returned an error
            if echo "$LATEST_RESPONSE" | jq -e '.message' > /dev/null 2>&1; then
              ERROR_MSG=$(echo "$LATEST_RESPONSE" | jq -r .message)
              echo "API Error: $ERROR_MSG"
            fi
            
            # If tag_name is null or empty, try getting the first release tag
            if [ -z "$UBOOT_TAG" ] || [ "$UBOOT_TAG" = "null" ]; then
              echo "Warning: Could not get latest release tag, trying first release..."
              RELEASES_RESPONSE=$(curl -s https://api.github.com/repos/${UBOOT_REPO}/releases)
              # Check if response is an array and has elements
              if echo "$RELEASES_RESPONSE" | jq -e 'type == "array" and length > 0' > /dev/null 2>&1; then
                UBOOT_TAG=$(echo "$RELEASES_RESPONSE" | jq -r '.[0].tag_name' | head -1)
              elif echo "$RELEASES_RESPONSE" | jq -e 'type == "array"' > /dev/null 2>&1; then
                echo "Warning: Releases array is empty"
              else
                echo "Error: Releases API did not return an array"
                echo "Response type: $(echo "$RELEASES_RESPONSE" | jq -r 'type')"
                echo "Response preview: $(echo "$RELEASES_RESPONSE" | head -c 200)"
              fi
            fi
          else
            # If UBOOT_RELEASE is a specific tag, use it directly
            UBOOT_TAG="${UBOOT_RELEASE}"
          fi
          
          # Validate tag
          if [ -z "$UBOOT_TAG" ] || [ "$UBOOT_TAG" = "null" ]; then
            echo "Error: Failed to get u-boot tag"
            echo "UBOOT_REPO: ${UBOOT_REPO}"
            echo "UBOOT_RELEASE: ${UBOOT_RELEASE}"
            echo "Attempting to list available releases..."
            curl -s https://api.github.com/repos/${UBOOT_REPO}/releases | jq -r '.[] | .tag_name' | head -5
            exit 1
          fi
          
          echo "U-Boot tag resolved: ${UBOOT_TAG}"
          
          ARMBIAN_SHA=$(curl -s https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF} | jq -r .sha)

          cat <<EOF | sed -E 's/^  //' >>$GITHUB_ENV
            TIME=$TIME
            TAG=$TAG
            SCRIPT_SHA=$SCRIPT_SHA
            UBOOT_TAG=$UBOOT_TAG
            ARMBIAN_SHA=$ARMBIAN_SHA
          EOF
          echo "env=$(cat $GITHUB_ENV | base64 -w 0)" >>$GITHUB_OUTPUT

      - name: Show repositories information
        run: |
          echo "::group::Repositories Information"
          echo "TIME: $(date -d "$TIME" +'%Y-%m-%d %H:%M:%S %Z')"
          echo "Script: ${SCRIPT_REPO}@${SCRIPT_REF} (${SCRIPT_SHA})"
          echo "U-Boot: ${UBOOT_REPO}@${UBOOT_RELEASE} (${UBOOT_TAG})"
          echo "Armbian: ${ARMBIAN_REPO}@${ARMBIAN_REF} (${ARMBIAN_SHA})"
          echo "::endgroup::"

  build-debs:
    name: Build ${{ matrix.BRANCH }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH:
          - current

    steps:
      - name: Import env
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Configure Git for network reliability
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.timeout 600
          git config --global http.sslVerify true
          git config --global core.compression 0
          git config --global http.version HTTP/1.1
          
          # Configure Git in the build directory
          git config http.postBuffer 524288000
          git config http.timeout 600
          git config http.lowSpeedLimit 0
          git config http.lowSpeedTime 999999

      - name: Build kernel
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 0
          GIT_HTTP_LOW_SPEED_TIME: 999999
          GIT_HTTP_TIMEOUT: 600
        run: |
          export GITHUB_ACTIONS=false
          
          # Retry mechanism for network issues (especially git.kernel.org)
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if yes "no" | timeout 10800 sudo --preserve-env \
              ./compile.sh kernel \
                ALLOW_ROOT=yes \
                BOARD=onecloud \
                BRANCH=${{ matrix.BRANCH }} \
                EXPERT=yes \
                USE_CCACHE=no; then
              echo "Kernel build completed successfully"
              sudo chown $(id -u):$(id -g) -R output/
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Kernel build failed, retrying... (Attempt $RETRY_COUNT/$MAX_RETRIES)"
                sleep 30
              else
                echo "Kernel build failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/*

  build:
    name: Build ${{ matrix.RELEASE }}-${{ matrix.BRANCH }}-${{ matrix.TYPE == 'desktop' && matrix.DESKTOP_ENVIRONMENT || matrix.TYPE }}
    needs: [ prepare, build-debs ]
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        BRANCH:
          - current
        RELEASE:
          - bullseye
          - bookworm
          - jammy
        TYPE:
          - minimal
          - cli
          - desktop
        include:
          - TYPE: desktop
            DESKTOP_ENVIRONMENT: xfce
            DESKTOP_ENVIRONMENT_CONFIG_NAME: config_base
            DESKTOP_APPGROUPS_SELECTED: ""
        exclude:
          # Exclude desktop builds for bullseye (Debian 11) as it doesn't support XFCE
          - RELEASE: bullseye
            TYPE: desktop

    steps:
      - name: Import env
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Configure Git for network reliability
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.timeout 600
          git config --global http.sslVerify true
          git config --global core.compression 0
          git config --global http.version HTTP/1.1
          
          # Configure Git in the build directory
          git config http.postBuffer 524288000
          git config http.timeout 600
          git config http.lowSpeedLimit 0
          git config http.lowSpeedTime 999999

      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/

      - name: Build image
        env:
          DEBIAN_FRONTEND: noninteractive
          GIT_HTTP_LOW_SPEED_LIMIT: 0
          GIT_HTTP_LOW_SPEED_TIME: 999999
          GIT_HTTP_TIMEOUT: 600
        run: |
          export GITHUB_ACTIONS=false
          
          # Retry mechanism for network issues (especially git.kernel.org)
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if yes "no" | timeout 10800 sudo --preserve-env \
              ./compile.sh build \
                ALLOW_ROOT=yes \
                BOARD=onecloud \
                BRANCH=${{ matrix.BRANCH }} \
                RELEASE=${{ matrix.RELEASE }} \
                KERNEL_CONFIGURE=no \
                BUILD_MINIMAL=${{ matrix.TYPE == 'minimal' && 'yes' || 'no' }} \
                BUILD_DESKTOP=${{ matrix.TYPE == 'desktop' && 'yes' || 'no' }} \
                DESKTOP_ENVIRONMENT=${{ matrix.DESKTOP_ENVIRONMENT }} \
                DESKTOP_ENVIRONMENT_CONFIG_NAME=${{ matrix.DESKTOP_ENVIRONMENT_CONFIG_NAME }} \
                DESKTOP_APPGROUPS_SELECTED=${{ matrix.DESKTOP_APPGROUPS_SELECTED }} \
                EXPERT=yes \
                SKIP_EXTERNAL_TOOLCHAINS=yes \
                CLEAN_LEVEL= \
                USE_CCACHE=no \
                COMPRESS_OUTPUTIMAGE=img; then
              echo "Build completed successfully"
              sudo chown $(id -u):$(id -g) -R output/
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Build failed, retrying... (Attempt $RETRY_COUNT/$MAX_RETRIES)"
                sleep 30
              else
                echo "Build failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Install Dependents
        run: |
          echo "::group::Install img2simg"
          # Try to install img2simg, if fails, install android-sdk-libsparse-utils and create symlink
          if ! sudo apt install -y img2simg 2>/dev/null; then
            echo "img2simg package not found, installing android-sdk-libsparse-utils..."
            sudo apt install -y android-sdk-libsparse-utils
            # Find img2simg in the package and create symlink if needed
            IMG2SIMG_PATH=$(find /usr -name "img2simg" 2>/dev/null | head -1)
            if [ -n "$IMG2SIMG_PATH" ] && [ ! -f /usr/local/bin/img2simg ]; then
              sudo ln -s "$IMG2SIMG_PATH" /usr/local/bin/img2simg
            fi
          fi
          img2simg --version || img2simg --help || echo "img2simg available"
          echo "::endgroup::"

          echo "::group::Download AmlImg"
          ver="v0.3.1"
          curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg
          echo "::endgroup::"

      - name: Download and unpack u-boot
        run: |
          echo "::group::Download u-boot"
          echo "U-Boot repo: ${UBOOT_REPO}"
          echo "U-Boot tag: ${UBOOT_TAG}"
          echo "U-Boot file: ${UBOOT_BURNIMG}"
          
          # Verify tag is set
          if [ -z "${UBOOT_TAG}" ] || [ "${UBOOT_TAG}" = "null" ]; then
            echo "Error: UBOOT_TAG is not set or invalid"
            echo "Attempting to get latest tag..."
            UBOOT_TAG=$(curl -s https://api.github.com/repos/${UBOOT_REPO}/releases/latest | jq -r .tag_name)
            if [ -z "$UBOOT_TAG" ] || [ "$UBOOT_TAG" = "null" ]; then
              UBOOT_TAG=$(curl -s https://api.github.com/repos/${UBOOT_REPO}/releases | jq -r '.[0].tag_name' | head -1)
            fi
            echo "Retrieved tag: ${UBOOT_TAG}"
          fi
          
          if [ -z "${UBOOT_TAG}" ] || [ "${UBOOT_TAG}" = "null" ]; then
            echo "Error: Cannot determine u-boot tag"
            exit 1
          fi
          
          DOWNLOAD_URL="https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}"
          echo "Download URL: ${DOWNLOAD_URL}"
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Download attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
            if curl -L -f -o ./uboot.img "${DOWNLOAD_URL}"; then
              # Check if file was downloaded and has reasonable size (> 1MB)
              if [ -f ./uboot.img ] && [ $(stat -f%z ./uboot.img 2>/dev/null || stat -c%s ./uboot.img 2>/dev/null || echo 0) -gt 1048576 ]; then
                echo "Download successful"
                ls -lh ./uboot.img
                break
              else
                echo "Downloaded file is too small or missing"
                rm -f ./uboot.img
              fi
            else
              echo "Download failed"
              rm -f ./uboot.img
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            else
              echo "Failed to download u-boot after $MAX_RETRIES attempts"
              exit 1
            fi
          done
          echo "::endgroup::"

          echo "::group::Unpack u-boot"
          # Verify file before unpacking
          if [ ! -f ./uboot.img ]; then
            echo "Error: uboot.img not found"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z ./uboot.img 2>/dev/null || stat -c%s ./uboot.img 2>/dev/null || echo 0)
          echo "File size: $FILE_SIZE bytes"
          
          if [ $FILE_SIZE -lt 1048576 ]; then
            echo "Error: File too small, likely corrupted"
            exit 1
          fi
          
          ./AmlImg unpack ./uboot.img burn/
          
          # Verify unpack was successful
          if [ ! -d "burn" ] || [ -z "$(ls -A burn/ 2>/dev/null)" ]; then
            echo "Error: Unpack failed or burn directory is empty"
            exit 1
          fi
          echo "Unpack successful"
          ls -la burn/
          echo "::endgroup::"

      - name: Extract boot and rootfs partitions
        run: |
          echo "::group::Extract partitions"
          diskimg=$(ls output/images/*.img | grep -v "\.burn\.img$" | head -1)
          if [ -z "$diskimg" ]; then
            echo "Error: No Armbian image file found"
            exit 1
          fi
          echo "Found image: $diskimg"
          
          loop=$(sudo losetup --find --show --partscan "$diskimg")
          sudo img2simg ${loop}p1 burn/boot.simg
          sudo img2simg ${loop}p2 burn/rootfs.simg
          sudo losetup -d $loop
          sudo chown $(id -u):$(id -g) -R burn/
          echo "::endgroup::"

      - name: Generate burn image
        run: |
          echo "::group::Generate burn image"
          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" >burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" >burn/rootfs.VERIFY

          cat <<EOF >>burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF

          prefix=$(ls output/images/*.img | grep -v "\.burn\.img$" | sed 's/\.img$//' | head -1)
          burnimg=${prefix}.burn.img
          ./AmlImg pack $burnimg burn/
          echo "Generated: $burnimg"
          ls -lh "$burnimg"
          echo "::endgroup::"

      - name: Hash and compress images
        run: |
          echo "::group::Hash and compress"
          cd output/images
          for f in *.img; do
            if [ -f "$f" ]; then
              sha256sum "$f" | tee -a sha256sum
              xz --threads=0 --compress "$f"
            fi
          done
          echo "::endgroup::"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.RELEASE }}-${{ matrix.BRANCH }}-${{ matrix.TYPE == 'desktop' && matrix.DESKTOP_ENVIRONMENT || matrix.TYPE }}-${{ github.run_number }}
          path: output/images/*
          retention-days: 30
          if-no-files-found: warn

      - name: Generate release informations
        if: success()
        run: |
          cat <<EOF | sed -E 's/^  //' | tee Release.md
            $(cat output/images/sha256sum | awk '{printf "%s: `%s`\n", $2, $1}')
          EOF

      - name: Build Summary
        if: always()
        run: |
          echo "::group::Build Summary"
          echo "Branch: ${{ matrix.BRANCH }}"
          echo "Release: ${{ matrix.RELEASE }}"
          echo "Type: ${{ matrix.TYPE }}"
          echo "Desktop: ${{ matrix.DESKTOP_ENVIRONMENT || 'N/A' }}"
          echo "Status: ${{ job.status }}"
          echo "::endgroup::"
